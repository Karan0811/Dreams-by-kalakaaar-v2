openapi: 3.0.3
info:
  title: Dreams by Kalakaaar v2 — Backend API
  version: "1.0.0-phase1"
  description: >
    REST contract for the endpoints implemented in this phase (see
    ../../backend/SCOPE.md for what's in vs. deferred). Response envelope
    and error format follow 09-api-architecture.md Sections 2.15-2.16
    exactly; this file documents only what's actually implemented, not the
    full documented API surface — see 09-api-architecture.md itself for
    the complete, aspirational contract.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Creators
  - name: Products
  - name: Health

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: OK }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (Postgres + Redis)
      security: []
      responses:
        "200": { description: Ready }
        "503": { $ref: "#/components/responses/Error" }

  /health/deep:
    get:
      tags: [Health]
      summary: Deep dependency health check (operator-only)
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 128 }
                displayName: { type: string, minLength: 2, maxLength: 50 }
                marketingConsent: { type: boolean, default: false }
      responses:
        "201":
          description: Account created
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly refresh-token cookie
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Authenticated }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session and refresh token
      security: []
      responses:
        "204": { description: Logged out }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token and issue a new access token
      security: []
      responses:
        "200": { description: New access token issued }
        "401": { $ref: "#/components/responses/Error" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated identity + roles
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Error" }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (requires current password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Password changed; all other sessions revoked }
        "401": { $ref: "#/components/responses/Error" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password-reset email (always 204, no account enumeration)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "204": { description: Always returned regardless of whether the email exists }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Complete a password reset with a token from email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Password reset }
        "401": { $ref: "#/components/responses/Error" }

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm an email address with a token from email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "204": { description: Email verified }
        "401": { $ref: "#/components/responses/Error" }

  /users/me/profile:
    get:
      tags: [Users]
      summary: Get my profile
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Users]
      summary: Update my profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                bio: { type: string }
                pronouns: { type: string }
                isPublicProfile: { type: boolean }
      responses:
        "200": { description: Updated }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /creator/apply:
    post:
      tags: [Creators]
      summary: Apply to become a Creator (creates a Creator + draft Store)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalName, category, storeName]
              properties:
                legalName: { type: string }
                businessName: { type: string }
                taxIdentifier: { type: string }
                category:
                  type: string
                  enum:
                    [
                      INDEPENDENT_ARTISAN,
                      CUSTOM_PERSONALIZATION_SPECIALIST,
                      SMALL_CREATIVE_STUDIO,
                      EMERGING_ASPIRING,
                    ]
                storeName: { type: string }
      responses:
        "201": { description: Application created }
        "409": { $ref: "#/components/responses/Error" }

  /creator/application:
    get:
      tags: [Creators]
      summary: My Creator application status
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }

  /stores/{storeId}/products:
    parameters:
      - name: storeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Products]
      summary: Create a Product (owner or products:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductInput" }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      tags: [Products]
      summary: List a Store's Products (every status; owner or products:read)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200": { description: OK }

  /stores/{storeId}/products/{productId}:
    parameters:
      - name: storeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: productId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Products]
      summary: Get a Product (owner-side, any status)
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Products]
      summary: Update fields, or transition status (publish/pause/archive)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/UpdateProductInput"
                - $ref: "#/components/schemas/ProductStatusTransition"
      responses:
        "200": { description: Updated }
        "422":
          description: >
            Publish-readiness failure (422 VALIDATION_ERROR) — e.g.
            attempting to set status=ACTIVE with zero media attached.

  /products:
    get:
      tags: [Products]
      summary: Public Product listing (ACTIVE only)
      security: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }

  /products/{idOrSlug}:
    get:
      tags: [Products]
      summary: Public Product detail (ACTIVE only) by ID or slug
      security: []
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error envelope (09-api-architecture.md Section 2.15)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }
            correlationId: { type: string }
            timestamp: { type: string, format: date-time }

    CreateProductInput:
      type: object
      required: [title, description, variants]
      properties:
        title: { type: string }
        description: { type: string }
        productType: { type: string, enum: [READY_MADE, MADE_TO_ORDER] }
        leadTimeDays: { type: integer }
        primaryCategoryId: { type: string, format: uuid }
        variants:
          type: array
          minItems: 1
          items:
            type: object
            required: [priceAmount]
            properties:
              attributes: { type: object, additionalProperties: { type: string } }
              priceAmount: { type: integer, description: "Integer minor units" }
              priceCurrency: { type: string, default: INR }
              skuReference: { type: string }
              initialQuantity: { type: integer, default: 0 }

    UpdateProductInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        leadTimeDays: { type: integer }
        primaryCategoryId: { type: string, format: uuid }

    ProductStatusTransition:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, PAUSED, ARCHIVED] }
